[pytest]
testpaths = tests
addopts = -ra
    -p no:qt
    --ignore=tests/test_ui_integration.py
    --ignore=tests/test_excel_toolbar_responsive.py
    --ignore=tests/test_coordinate_overlay_mapping.py
    --ignore=tests/test_manager_tab_integration.py
console_output_style = classic
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
# NOTE: UI tests above require a real display (Qt/headless incompatible).
# Run them manually: python -m pytest tests/test_ui_integration.py -q
