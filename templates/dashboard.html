<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구글 메시지 다운로더 v5.0 - 대시보드</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            background: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .tab:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .tab.active {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .chart-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .chart-card h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .progress-section,
        .log-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .progress-bar-container {
            background: #e0e0e0;
            border-radius: 20px;
            height: 30px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .log-container {
            background: #1e1e1e;
            border-radius: 5px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .log-line {
            color: #d4d4d4;
            margin-bottom: 5px;
        }

        .log-line.info {
            color: #4ec9b0;
        }

        .log-line.warning {
            color: #dcdcaa;
        }

        .log-line.error {
            color: #f48771;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }

        .status-badge.running {
            background: #4caf50;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📊 구글 메시지 다운로더 v5.0</h1>
            <p>실시간 작업 모니터링 & 데이터 분석 대시보드</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('monitor')">실시간 모니터링</button>
            <button class="tab" onclick="switchTab('analysis')">데이터 분석</button>
        </div>

        <!-- 모니터링 탭 -->
        <div id="monitor-tab" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>전체 작업</h3>
                    <div class="value" id="total-jobs">0</div>
                </div>
                <div class="stat-card">
                    <h3>완료</h3>
                    <div class="value" style="color: #4caf50;" id="completed-jobs">0</div>
                </div>
                <div class="stat-card">
                    <h3>실패</h3>
                    <div class="value" style="color: #f44336;" id="failed-jobs">0</div>
                </div>
                <div class="stat-card">
                    <h3>평균 처리 시간</h3>
                    <div class="value" style="font-size: 24px;" id="avg-duration">0s</div>
                </div>
            </div>

            <div class="progress-section">
                <h2>현재 진행 상황 <span class="status-badge running" id="status-badge">실행 중</span></h2>
                <p id="current-customer">대기 중...</p>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progress-bar">0%</div>
                </div>
                <p style="text-align: center; color: #666;" id="progress-text">0 / 0</p>
            </div>

            <div class="log-section">
                <h2>실시간 로그</h2>
                <div class="log-container" id="log-container">
                    <div class="log-line">대시보드 연결 대기 중...</div>
                </div>
            </div>
        </div>

        <!-- 분석 탭 -->
        <div id="analysis-tab" class="tab-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>총 고객 수</h3>
                    <div class="value" id="summary-customers">0</div>
                </div>
                <div class="stat-card">
                    <h3>총 메시지</h3>
                    <div class="value" id="summary-messages">0</div>
                </div>
                <div class="stat-card">
                    <h3>총 첨부파일</h3>
                    <div class="value" id="summary-attachments">0</div>
                </div>
                <div class="stat-card">
                    <h3>평균 메시지/고객</h3>
                    <div class="value" id="summary-avg">0</div>
                </div>
            </div>

            <div class="chart-row">
                <div class="chart-card">
                    <h3>키워드 빈도 분석</h3>
                    <canvas id="keywordChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3>시간대별 메시지 분포</h3>
                    <canvas id="timelineChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3>고객별 메시지 통계 (Top 10)</h3>
                <canvas id="customerChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let keywordChart, timelineChart, customerChart;

        // 탭 전환
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            if (tab === 'monitor') {
                document.querySelector('button[onclick*="monitor"]').classList.add('active');
                document.getElementById('monitor-tab').classList.add('active');
            } else {
                document.querySelector('button[onclick*="analysis"]').classList.add('active');
                document.getElementById('analysis-tab').classList.add('active');
                loadAnalysisData();
            }
        }

        // WebSocket
        socket.on('connect', function () {
            addLog('✅ 대시보드 연결 완료', 'info');
            socket.emit('request_progress');
        });

        socket.on('log_message', function (data) {
            let logClass = 'info';
            if (data.message.includes('ERROR') || data.message.includes('실패')) {
                logClass = 'error';
            } else if (data.message.includes('WARNING') || data.message.includes('경고')) {
                logClass = 'warning';
            }
            addLog(data.message, logClass);
        });

        socket.on('progress_update', function (data) {
            const { current, total, customer_name, percentage } = data;
            document.getElementById('progress-bar').style.width = percentage + '%';
            document.getElementById('progress-bar').textContent = percentage + '%';
            document.getElementById('progress-text').textContent = `${current} / ${total}`;
            document.getElementById('current-customer').textContent =
                customer_name ? `처리 중: ${customer_name}` : '대기 중...';
        });

        function addLog(message, className) {
            const logLine = document.createElement('div');
            logLine.className = `log-line ${className}`;
            logLine.textContent = message;
            const container = document.getElementById('log-container');
            container.appendChild(logLine);
            container.scrollTop = container.scrollHeight;
        }

        // 통계 업데이트
        function updateStats() {
            fetch('/api/stats')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('total-jobs').textContent = data.total || 0;
                    document.getElementById('completed-jobs').textContent = data.completed || 0;
                    document.getElementById('failed-jobs').textContent = data.failed || 0;
                    document.getElementById('avg-duration').textContent =
                        (data.avg_duration || 0).toFixed(1) + 's';
                });
        }

        // 분석 데이터 로드
        function loadAnalysisData() {
            // 요약 통계
            fetch('/api/analysis/summary')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('summary-customers').textContent = data.total_customers || 0;
                    document.getElementById('summary-messages').textContent = data.total_messages || 0;
                    document.getElementById('summary-attachments').textContent = data.total_attachments || 0;
                    document.getElementById('summary-avg').textContent = data.avg_messages_per_customer || 0;
                });

            // 키워드 차트
            fetch('/api/analysis/keywords')
                .then(res => res.json())
                .then(data => {
                    const ctx = document.getElementById('keywordChart').getContext('2d');
                    if (keywordChart) keywordChart.destroy();
                    keywordChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: Object.keys(data),
                            datasets: [{
                                label: '빈도',
                                data: Object.values(data),
                                backgroundColor: 'rgba(102, 126, 234, 0.6)'
                            }]
                        }
                    });
                });

            // 시간대 차트
            fetch('/api/analysis/timeline')
                .then(res => res.json())
                .then(data => {
                    const ctx = document.getElementById('timelineChart').getContext('2d');
                    if (timelineChart) timelineChart.destroy();
                    timelineChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: Object.keys(data),
                            datasets: [{
                                label: '메시지 수',
                                data: Object.values(data),
                                borderColor: 'rgba(118, 75, 162, 1)',
                                fill: true,
                                backgroundColor: 'rgba(118, 75, 162, 0.2)'
                            }]
                        }
                    });
                });

            // 고객별 차트
            fetch('/api/analysis/customers')
                .then(res => res.json())
                .then(data => {
                    const top10 = data.slice(0, 10);
                    const ctx = document.getElementById('customerChart').getContext('2d');
                    if (customerChart) customerChart.destroy();
                    // Chart.js v4: use bar + indexAxis for horizontal bars.
                    customerChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: top10.map(c => c.name),
                            datasets: [{
                                label: '메시지 수',
                                data: top10.map(c => c.total_messages),
                                backgroundColor: 'rgba(102, 126, 234, 0.6)'
                            }]
                        },
                        options: {
                            indexAxis: 'y'
                        }
                    });
                });
        }

        // 5초마다 통계 갱신
        setInterval(updateStats, 5000);
        updateStats();
    </script>
</body>

</html>
