name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      IMAGEMACRO_TRIGGER_START_LOG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install PyQt5 mss numpy opencv-python pyautogui pyperclip pillow pynput psutil

      - name: Governance guard (commit policy + file policy)
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/ci_governance_guard.py

      - name: Run pytest
        run: python -m pytest -q

      - name: Run health check
        run: python run_health_check.py
